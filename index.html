function updatePolice(){

      if (c.x > c.home + c.range) c.dir = -1; if (c.x < c.home - c.range) c.dir = 1;
      if (Math.abs(dx) < 65 && dx * c.dir > 0 && low && c.cool <= 0){ c.mode = 'chase'; c.t = 0; S('whistle'); }
    } else {
      c.t++; c.dir = dx >= 0 ? 1 : -1;
      if (low) c.x += c.dir * 1.5;
      if (c.t > 150 || Math.abs(dx) > 190){ c.mode = 'patrol'; c.dir = c.x > c.home ? -1 : 1; c.cool = 90; }
    }
    if (overlap(player, { x:c.x + 2, y:FLOOR - 24, w:10, h:24 })){

function saveSettings(){ try { localStorage.setItem('sidiSettings', JSON.stringify(SETTINGS)); } catch(e){} }
function applySettings(){ if (sfxG) sfxG.gain.value = 0.7 * (SETTINGS.sfx / 10); }

const PAUSE_MENU = ["Reprendre", "Options", "Quitter la partie"];
let pausePrev = 'play', pauseSel = 0;

function resumeGame(){ state = pausePrev || 'play'; S('select'); }
 
/* ---------- Options ---------- */
const OPT_ROWS = ["Musique", "Sons", "Sensibilité", "Normal", "Retour"];
let optSel = 0, optionsBack = 'title';
function optLabel(row){
  if (row === "Musique") return SETTINGS.music * 10 + "%";
  if (row === "Sons") return SETTINGS.sfx * 10 + "%";
  if (row === "Sensibilité") return SENS_LABELS[SETTINGS.sens];
  return "";
}
function optNav(dir){ optSel = (optSel + OPT_ROWS.length + dir) % OPT_ROWS.length; S('select'); }
function optChange(dir){
  if (optSel === 0) SETTINGS.music = Math.min(10, Math.max(0, SETTINGS.music + dir));
  else if (optSel === 1) SETTINGS.sfx = Math.min(10, Math.max(0, SETTINGS.sfx + dir));
  else if (optSel === 2) SETTINGS.sens = Math.min(2, Math.max(0, SETTINGS.sens + dir));
  else return;
  applySettings(); saveSettings(); S('select');
}
function optActivate(){
  const row = OPT_ROWS[optSel];
  if (row === "Normal") resetSettings();
  else if (row === "Retour"){ state = optionsBack; if (state === 'pause') pauseSel = 0; }
}

let li = 0, level, player, friends, coins, camera = 0, history, score = 0, collected = 0, portions = MAXP;
let state = 'title', tick = 0, stageT = 0, deliverT = 0, safe, CS = null, fadeIn = 0;
const keys = { left:false, right:false, jump:false };
 
function loadLevel(i){
  li = i; const L = LEVELS[i];
  let x = 0; const houses = L.houses.map(([w,y,gap]) => { const h = { x, y, w, gap }; x += w + gap; return h; });
  const last = houses[houses.length-1];
  level = { name:L.name, houses, width:last.x + last.w,
    rects: houses.map(h => ({ x:h.x, y:h.y, w:h.w, h:STREET - h.y })),
    cacti: L.cacti.map(([hi, off]) => ({ x:houses[hi].x + off, y:houses[hi].y })),
    gulls: L.gulls.map(hi => { const h = houses[hi], n = houses[hi+1];
      return { cx:h.x + h.w + h.gap/2, cy:Math.min(h.y, n.y) - 38, amp:h.gap/2 + 15, ph:hi }; }),
    flagX: last.x + last.w - 24, flagY: last.y,
    mom: i === LEVELS.length - 1 ? { x:last.x + last.w - 44, y:last.y } : null };
  coins = [];
  houses.forEach((h, hi) => {
    for (let j = 0; j < Math.floor(h.w/40); j++)
      if (hi > 0 && hh(hi*5 + j + i*99) > 0.45) coins.push({ x:h.x + 24 + j*36, y:h.y - 14, got:false });
    const n = houses[hi+1];
    if (n){ const mx = h.x + h.w + h.gap/2, my = Math.min(h.y, n.y) - 46;
      coins.push({ x:mx-14, y:my+6, got:false }, { x:mx, y:my, got:false }, { x:mx+14, y:my+6, got:false }); }
  });
  portions = MAXP; camera = 0;
  safe = { x:30, y:houses[0].y - 24, house:0 };
  respawn();
}
function respawn(){
  player = { x:safe.x, y:safe.y - 1, w:12, h:24, vx:0, vy:0, onGround:false, dir:1, moving:false, inv:60, kb:0, kdir:1, house:null };
  const minX = level.houses[safe.house].x;
  const cs2 = comps(); friends = [ { name:cs2[0], delay:16 }, { name:cs2[1], delay:32 } ];
  history = [];
  for (let k = 0; k < 40; k++) history.push({ x:Math.max(minX, player.x - (39-k)*2.5), y:player.y, dir:1, moving:false });
  for (const f of friends){ const h = history[39 - f.delay]; f.x = h.x; f.y = h.y; f.dir = 1; f.moving = false; }
}
function startGame(){ MODE = 'roof'; score = 0; collected = 0; SCRIPT = buildScript(); loadLevel(0); state = 'cutscene'; CS = { i:0, typed:0, acc:0, phase:'talk', t:0, bar:0 }; }
function gullPos(g){
  const a = tick*0.03 + g.ph;
  return { x:g.cx + Math.sin(a)*g.amp, y:g.cy + Math.sin(tick*0.08 + g.ph)*6, dir:Math.cos(a) >= 0 ? 1 : -1 };
}
function hurt(fromX){
  if (player.inv > 0) return;
  portions--; player.inv = 90; player.vy = -4; player.kb = 8; player.kdir = player.x < fromX ? -1 : 1;
  if (portions <= 0) setLost(); else S('hurt');
}
 
/* ---------- Mise à jour ---------- */
function update(){
  tick++;
  if (fadeIn > 0) fadeIn--;
  if (state === 'credits') creditsT++;
  if (accMsgT > 0) accMsgT--;
  if (pinMsgT > 0) pinMsgT--;
  if (AC && tick % 30 === 0) musicG.gain.setTargetAtTime((['title','select','levels','credits','cutscene','dialog','login','newaccount','adminpin','options','pause'].includes(state) ? 0.18 : 0.3) * (SETTINGS.music / 10), AC.currentTime, 0.3);
  if (state === 'cutscene'){ cutUpdate(); return; }
  if (state === 'loading'){ if (++loadingT > 95) startGame(); return; }
  if (state === 'lost'){ lostUpdate(); return; }
  if (state === 'dialog'){ dlgUpdate(); return; }
  if (state === 'cook'){ cookUpdate(); return; }
  if (state === 'play' && MODE === 'remote'){ updateRemote(); return; }
  if (state === 'play' && MODE !== 'roof'){ updateStreet(); return; }
  if (state === 'stage'){ if (--stageT <= 0){ loadLevel(li + 1); state = 'play'; } return; }
  if (state === 'deliver'){ if (++deliverT > 230){ state = 'win'; winKind = 'roof'; PROG.done1 = true; saveProg(); } return; }
  if (state !== 'play') return;
 
  if (player.inv > 0) player.inv--;
  player.vx = ((keys.right?1:0) - (keys.left?1:0)) * SPD();
  if (player.kb > 0){ player.vx = player.kdir * 2; player.kb--; }
  if (player.vx && !player.kb) player.dir = Math.sign(player.vx);
  if (keys.jump && player.onGround){ player.vy = -JUMP; player.onGround = false; S('jump'); }
  player.vy = Math.min(player.vy + G, 9);
 
  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  for (const r of level.rects) if (overlap(player, r)){ if (player.vx > 0) player.x = r.x - player.w; else if (player.vx < 0) player.x = r.x + r.w; }
  player.y += player.vy; player.onGround = false; player.house = null;
  level.rects.forEach((r, idx) => {
    if (overlap(player, r)){
      if (player.vy > 0){ player.y = r.y - player.h; player.onGround = true; player.house = idx; }
      else if (player.vy < 0) player.y = r.y + r.h;
      player.vy = 0;
    }
  });
  player.moving = player.onGround && player.vx !== 0;
 
  if (player.onGround && player.house !== null){
    const h = level.houses[player.house];
    if (player.x > h.x + 6 && player.x + player.w < h.x + h.w - 6) safe = { x:player.x, y:player.y, house:player.house };
  }
  // Chute dans la ruelle : une portion de couscous renversée
  if (player.y + player.h >= STREET - 1){
    portions--; if (portions <= 0){ setLost(); return; }
    S('fall'); respawn(); return;
  }
  for (const c of level.cacti) if (overlap(player, { x:c.x+1, y:c.y-8, w:8, h:8 })) hurt(c.x + 5);
  for (const g of level.gulls){ const p = gullPos(g); if (overlap(player, { x:p.x-6, y:p.y-2, w:12, h:8 })) hurt(p.x); }
  if (state !== 'play') return;
 
  for (const c of coins)
    if (!c.got && overlap(player, { x:c.x-6, y:c.y-6, w:12, h:12 })){ c.got = true; score += 10; collected++; S('coin'); }
 
  history.push({ x:player.x, y:player.y, dir:player.dir, moving:player.moving });
  if (history.length > 120) history.shift();
  for (const f of friends){
    const h = history[Math.max(0, history.length - 1 - f.delay)];
    f.x = h.x; f.y = h.y; f.dir = h.dir; f.moving = h.moving;
  }
 
  if (level.mom){
    if (player.x + player.w >= level.mom.x - 6){ state = 'deliver'; deliverT = 0; score += portions * 100; S('deliver'); }
  } else if (player.x > level.flagX){ score += 50; state = 'stage'; stageT = 130; S('stage'); }
 
  camera += (player.x - W/3 - camera) * 0.12;
  camera = Math.max(0, Math.min(level.width - W, camera));
}

    if (item === "Reprendre") resumeGame();
    else if (item === "Options"){ optionsBack = 'pause'; optSel = 0; state = 'options'; }
    else if (item === "Quitter la partie"){ S('select'); state = 'title'; menuSel = 0; }
  }
}
function navKey(dir){       // dir = -1 (gauche/haut) ou +1 (droite/bas)
  S('select');
  if (state === 'title') menuSel = (menuSel + MENU.length + dir) % MENU.length;
  else if (state === 'pause') pauseSel = (pauseSel + PAUSE_MENU.length + dir) % PAUSE_MENU.length;
  else if (state === 'select') selIdx = (selIdx + 3 + dir) % 3;
  else if (state === 'levels') selLvl = (selLvl + 4 + dir) % 4;
  else if (state === 'admin') adminSel = (adminSel + adminRows().length + dir) % adminRows().length;
}
const nameInput = document.getElementById('nameInput'), pinInput = document.getElementById('pinInput');
pinInput.addEventListener('input', () => { pinBuffer = pinInput.value.slice(0, 16); });
addEventListener('keydown', e => {
  if (document.activeElement === nameInput || document.activeElement === pinInput){
    if (e.key === 'Enter'){
      if (state === 'login') doLogin();
      else if (state === 'newaccount') doCreateAccount();
      else if (state === 'adminpin') pinConfirm();
    } else if (e.key === 'Escape'){
      document.activeElement.blur(); pinBuffer = '';
      if (state === 'newaccount'){ blurFields(); state = 'login'; }
    }
    return;
  }
  initAudio();
  if (map[e.key] && state !== 'pause'){ keys[map[e.key]] = true; e.preventDefault(); }
  if (state === 'title' || state === 'pause' || state === 'admin'){
    if (['ArrowUp','w','z'].includes(e.key)) navKey(-1);
    if (['ArrowDown','s'].includes(e.key)) navKey(1);
  } else if (state === 'select' || state === 'levels'){
    if (['ArrowLeft','a','q','ArrowUp'].includes(e.key)) navKey(-1);
    if (['ArrowRight','d','ArrowDown'].includes(e.key)) navKey(1);
  } else if (state === 'options'){
    if (['ArrowUp','w','z'].includes(e.key)) optNav(-1);
    if (['ArrowDown','s'].includes(e.key)) optNav(1);
    if (['ArrowLeft','a','q'].includes(e.key)) optChange(-1);
    if (['ArrowRight','d'].includes(e.key)) optChange(1);
  }
  if (state === 'title' && isAdmin() && (e.key === 'a' || e.key === 'A')){ S('select'); state = 'admin'; adminSel = 0; }
  if (state === 'admin'){
    const rows = adminRows(), nm = rows[adminSel];
    if (nm && nm !== '__changepw__' && nm !== '__back__'){
      if (e.key === 'r' || e.key === 'R') resetAccountProgress(nm);
      if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteAccount(nm); }
    }
  }
  if ((e.key === 'Enter' || (e.key === ' ' && state !== 'play' && state !== 'cook')) && !e.repeat) confirm();
  if ((e.key === 'p' || e.key === 'P') && (state === 'play' || state === 'cook')) pauseGame();
  else if ((e.key === 'p' || e.key === 'P') && state === 'pause') resumeGame();
  if (e.key === 'Escape'){
    if (state === 'pause') resumeGame();
    else if (state === 'play' || state === 'cook') pauseGame();
    else if (state === 'options'){ state = optionsBack; if (state === 'pause') pauseSel = 0; }
    else if (state === 'admin'){ S('select'); state = 'title'; }
    else if (state === 'newaccount'){ blurFields(); state = 'login'; }
    else if (state === 'select' || state === 'credits' || state === 'levels') state = 'title';
    else cutSkip();
  }
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => { if (map[e.key]) keys[map[e.key]] = false; });
function padNav(k){         // boutons tactiles ◀ ▶ ▲ dans les menus et dialogues
  if (state === 'play' || state === 'cook') return;
  if ((state === 'title' || state === 'select' || state === 'levels' || state === 'pause' || state === 'admin') && k !== 'jump') navKey(k === 'left' ? -1 : 1);
  else if (state === 'options' && k !== 'jump') optChange(k === 'left' ? -1 : 1);
  else if (k === 'jump') confirm();
}
[['bl','left'],['br','right'],['bj','jump']].forEach(([id,k]) => {
  const b = document.getElementById(id);
  const on = e => { initAudio(); keys[k] = true; padNav(k); e.preventDefault(); }, off = e => { keys[k] = false; e.preventDefault(); };
  b.addEventListener('touchstart', on); b.addEventListener('touchend', off); b.addEventListener('touchcancel', off);
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
});
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (x > W - 66 && y < 22){ toggleMute(); return; }
  if ((state === 'play' || state === 'cook') && x > W - 130 && x < W - 68 && y < 22){ pauseGame(); return; }
  if ((state === 'select' || state === 'levels') && x < 74 && y > 232 && y < 260){ S('select'); state = 'title'; return; }
  if (state === 'title' && isAdmin() && x > 8 && x < 92 && y > 8 && y < 24){ S('select'); state = 'admin'; adminSel = 0; return; }
  if (state === 'title'){
    for (let i = 0; i < MENU.length; i++)
      if (x > W/2 - 110 && x < W/2 + 110 && y > MENU_Y[i] - 10 && y < MENU_Y[i] + 6){ menuSel = i; menuActivate(); return; }
    return;
  }
  if (state === 'select' || state === 'levels'){
    for (let i = 0; i < 3; i++)
      if (x > CX[i] && x < CX[i] + 120 && y > 48 && y < 212){
        if (state === 'select'){ selIdx = i; confirm(); } else { selLvl = i; confirm(); }
        return;
      }
    return;
  }
  if (state === 'login'){
    if (x > W/2 - 70 && x < W/2 + 70 && y > 164 && y < 184){ doLogin(); return; }
    if (y > 194 && y < 206){ goToNewAccount(); return; }
    return;
  }
  if (state === 'newaccount'){
    if (x > W/2 - 70 && x < W/2 + 70 && y > 150 && y < 170){ doCreateAccount(); return; }
    if (y > 180 && y < 192){ blurFields(); state = 'login'; return; }
    return;
  }
  if (state === 'admin'){
    const rows = adminRows(), top = 50, maxH = 224 - top, rowH = Math.min(26, Math.floor(maxH / rows.length));
    for (let i = 0; i < rows.length; i++){
      const nm = rows[i], ry = top + i*rowH;
      if (y < ry || y > ry + rowH - 4) continue;
      if (nm !== '__changepw__' && nm !== '__back__'){
        if (x > 322 && x < 352){ adminSel = i; resetAccountProgress(nm); return; }
        if (x > 356 && x < 386){ adminSel = i; deleteAccount(nm); return; }
      }
      if (x > 50 && x < 430){ adminSel = i; confirm(); return; }
    }
    return;
  }
  if (state === 'options'){
    for (let i = 0; i < OPT_ROWS.length; i++){
      const cy = 90 + i*26;
      if (x > 110 && x < 370 && y > cy - 12 && y < cy + 10){
        optSel = i;
        if (i < 3){ optChange(x > 240 ? 1 : -1); } else confirm();
        return;
      }
    }
    return;
  }
  if (state === 'pause'){
    for (let i = 0; i < PAUSE_MENU.length; i++){
      const cy = 116 + i*34;
      if (x > W/2 - 90 && x < W/2 + 90 && y > cy - 13 && y < cy + 11){ pauseSel = i; confirm(); return; }
    }
    return;
  }
  confirm();
});
 
loadLevel(0);
loop();
if (!CURRENT){ state = 'login'; setTimeout(() => nameInput.focus(), 60); }
</script>
